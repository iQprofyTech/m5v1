; M5Stack Cardputer-Adv (Stamp-S3A, ESP32-S3FN8, 8 MB flash, no PSRAM)
; M5Cardputer >= 1.1.0 / M5Unified >= 0.2.8 need arduino-esp32 3.x, hence the pioarduino platform.

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DM5V1_VERSION=\"0.2.0\"
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.29
    m5stack/M5GFX@0.2.36
    bblanchon/ArduinoJson@7.4.3
